<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Laksh Builds - Collection of websites, tools, and resources built by Lakshminarayana Aigal.">
  <meta name="theme-color" content="#0F0F0F">
  <meta property="og:title" content="Laksh Builds | Projects by Lakshminarayana Aigal">
  <meta property="og:description" content="Collection of websites, tools, and resources built by Lakshminarayana Aigal.">
  <meta property="og:url" content="https://lnaigal.github.io/Laksh-Builds">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>Laksh Builds | Projects by Lakshminarayana Aigal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #050505;
      --surface-hover: #0b0b0b;
      --border: #151515;
      --text: #f5f5f5;
      --text-secondary: #c9c9c9;
      --text-muted: #6f6f6f;
      --accent: #ffffff;
      --radius: 0px;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f8f8f8;
      --surface-hover: #f3f3f3;
      --border: #e8e8e8;
      --text: #000000;
      --text-secondary: #2a2a2a;
      --text-muted: #8f8f8f;
      --accent: #000000;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
      line-height: 1.8;
      font-weight: 400;
    }

    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; font-family: inherit; cursor: pointer; }

    ::selection { background: var(--text); color: var(--bg); }

    .bg-grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.04) 1px, transparent 0);
      background-size: 60px 60px;
      opacity: 0.4;
    }
    .bg-noise {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      mix-blend-mode: soft-light;
    }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.6rem 5rem; transition: all 0.3s ease;
    }
    .navbar.scrolled {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 5rem;
    }
    [data-theme="light"] .navbar.scrolled {
      background: rgba(255, 255, 255, 0.92);
    }
    .navbar-inner {
      max-width: 1800px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 0.82rem; font-weight: 400; color: var(--text); letter-spacing: 0.58em; text-transform: uppercase;
    }
    .nav-links { display: flex; align-items: center; gap: 4rem; }
    .nav-links a {
      color: var(--text-secondary); font-weight: 400;
      font-size: 0.78rem; letter-spacing: 0.34em; text-transform: uppercase;
      transition: color 0.25s;
    }
    .nav-links a:hover { color: var(--text); }

    .theme-toggle {
      width: 36px; height: 36px; border-radius: 0;
      background: transparent; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: all 0.25s;
      color: var(--text-secondary);
    }
    .theme-toggle:hover { border-color: var(--text); color: var(--text); }

    .hamburger { display: none; flex-direction: column; gap: 5px; padding: 5px; }
    .hamburger span {
      width: 24px; height: 2px; background: var(--text);
      border-radius: 2px; transition: 0.3s;
    }
    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    /* Hero */
    .hero {
      position: relative;
      padding: 16rem 5rem 10rem; text-align: left; max-width: 1800px; margin: 0 auto;
    }
    .hero-label {
      position: relative;
      display: inline-block; font-size: 0.72rem; letter-spacing: 0.7em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 3rem;
    }
    .hero h1 {
      position: relative;
      font-size: clamp(5rem, 18vw, 19rem); font-weight: 400;
      color: var(--text); margin-bottom: 2.5rem; letter-spacing: -0.09em; line-height: 0.78;
      text-transform: uppercase;
    }
    .hero h1 .line { display: block; }
    .hero h1 .line-outline {
      -webkit-text-stroke: 1px var(--text);
      color: transparent;
    }
    .hero p {
      position: relative;
      font-size: clamp(0.98rem, 1.4vw, 1.08rem); color: var(--text-secondary);
      line-height: 2.2; max-width: 880px;
      letter-spacing: 0.01em;
    }

    /* Stats */
    .stats {
      max-width: 1600px; margin: 0 auto; padding: 0 4rem 6rem;
      display: flex; justify-content: space-between; gap: 4rem; flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 3rem;
    }
    .stat-group { display: flex; gap: 4rem; flex-wrap: wrap; }
    .stat {
      text-align: left;
    }
    .stat strong {
      display: block; font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 400; color: var(--text); letter-spacing: -0.04em;
    }
    .stat span {
      font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.4em; text-transform: uppercase;
    }

    /* Controls */
    .controls {
      max-width: 1400px; margin: 0 auto; padding: 0 3rem 3rem;
      display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;
    }
    .search-wrap {
      flex: 1; min-width: 260px; position: relative;
    }
    .search-wrap input {
      width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem;
      border-radius: 0; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      font-size: 0.9rem; outline: none; transition: all 0.25s;
      letter-spacing: 0.04em;
    }
    .search-wrap input:focus { border-color: var(--text); }
    .search-wrap .icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); color: var(--text-muted);
      pointer-events: none; font-size: 0.9rem;
    }
    .filter-group {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
    }
    .filter-group button {
      padding: 0.5rem 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); font-size: 0.82rem; font-weight: 500;
      transition: 0.2s;
    }
    .filter-group button:hover { border-color: var(--primary); color: var(--text); }
    .filter-group button.active {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }

    /* Projects */
    .projects {
      max-width: 1800px; margin: 0 auto; padding: 0 5rem 12rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2.2rem;
    }
    .card {
      grid-column: span 6;
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.01) 0%, transparent 100%), var(--surface);
      border: 1px solid var(--border);
      padding: 5rem 5rem 4.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      transition: all 0.4s ease;
      cursor: default;
      overflow: hidden;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 0.8s ease forwards;
    }
    .card > * { position: relative; z-index: 1; }
    .card:hover {
      border-color: var(--text);
    }
    @media (max-width: 1080px) {
      .card { grid-column: span 12; }
    }
    .card.hidden { display: none; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
    }
    .card-title-group { display: flex; flex-direction: column; gap: 0.8rem; }
    .card-index {
      font-size: 0.72rem; letter-spacing: 0.6em; text-transform: uppercase; color: var(--text-muted);
    }
    .card-name {
      font-size: clamp(2.6rem, 6vw, 4.8rem); font-weight: 400; letter-spacing: -0.06em; text-transform: uppercase;
    }
    .card-desc {
      font-size: 0.98rem; color: var(--text-secondary); line-height: 2.2; max-width: 720px;
    }
    .card-tags {
      display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem;
    }
    .card-tags span {
      font-size: 0.72rem; letter-spacing: 0.38em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .card-cta {
      font-size: 0.82rem; font-weight: 600; color: var(--primary);
      margin-top: 0.25rem;
    }

    /* Sections */
    .section-header {
      grid-column: 1 / -1;
      margin-top: 8rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .section-header:first-child { margin-top: 0; }
    .section-header h2 {
      font-size: 0.76rem; font-weight: 400; color: var(--text-muted);
      letter-spacing: 0.7em; text-transform: uppercase;
    }
    .section-count {
      font-size: 0.74rem; letter-spacing: 0.5em; color: var(--text-muted);
    }

    /* Featured badge */
    .badge-featured {
      position: absolute; top: 0.75rem; right: 0.75rem;
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-radius: 4px;
      background: linear-gradient(135deg, #FFD700, #F59E0B);
      color: #1a1a2e; z-index: 1;
    }

    /* Featured card highlight */
    .card-featured {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 4px 20px rgba(0, 212, 255, 0.08);
    }
    .card-featured:hover {
      box-shadow: 0 0 0 1px var(--primary), 0 8px 30px rgba(0, 212, 255, 0.15);
    }
    [data-theme="light"] .card-featured {
      box-shadow: 0 0 0 1px var(--primary), 0 4px 20px rgba(37, 99, 235, 0.1);
    }

    /* Card actions */
    .card-actions {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      margin-top: auto; padding-top: 0.5rem;
    }
    .btn-visit, .btn-github {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.78rem; font-weight: 600; padding: 0.4rem 0.9rem;
      border-radius: 8px; transition: 0.2s;
    }
    .btn-visit {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
      letter-spacing: 0.32em; text-transform: uppercase; font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }
    .btn-visit::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 77, 0, 0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .btn-visit:hover {
      border-color: var(--accent);
    }
    .btn-visit:hover::before {
      transform: translateX(100%);
    }
    .btn-github {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
      letter-spacing: 0.32em; text-transform: uppercase; font-size: 0.75rem;
    }
    .btn-github:hover {
      border-color: var(--text); color: var(--text);
    }

    /* No results */
    .no-results {
      grid-column: 1 / -1; text-align: center; padding: 3rem;
      color: var(--text-muted);
    }
    .no-results h3 { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 0.3rem; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem; text-align: center;
      color: var(--text-muted); font-size: 0.88rem;
    }
    footer a { color: var(--primary); font-weight: 500; }
    footer a:hover { text-decoration: underline; }

    /* Back to top */
    .back-top {
      position: fixed; bottom: 1.8rem; right: 1.8rem;
      width: 46px; height: 46px; border-radius: 0;
      background: transparent; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--text);
      opacity: 0; visibility: hidden; transform: translateY(12px);
      transition: all 0.25s; z-index: 99;
    }
    .back-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .back-top:hover { border-color: var(--text); }

    /* Screen reader only */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* Skip link */
    .skip-link {
      position: fixed; top: -100%; left: 1rem; z-index: 9999;
      background: var(--primary); color: #fff; padding: 0.6rem 1.2rem;
      border-radius: 0 0 8px 8px; font-size: 0.85rem; font-weight: 600;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }

    /* Mobile */
    @media (max-width: 768px) {
      .navbar { padding: 1rem 1.25rem; mix-blend-mode: normal; }
      .navbar.scrolled { padding: 0.9rem 1.25rem; }
      .nav-links {
        position: fixed; top: 0; right: -100%; width: 300px; height: 100vh;
        background: var(--bg); flex-direction: column;
        padding: 7rem 2rem 2rem; gap: 2rem;
        transition: right 0.4s ease; border-left: 1px solid var(--border);
        z-index: 1000;
      }
      .nav-links.open { right: 0; }
      .hamburger { display: flex; }
      .nav-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.7);
        z-index: 999; opacity: 0; visibility: hidden; transition: 0.4s;
      }
      .nav-overlay.show { opacity: 1; visibility: visible; }

      .hero { padding: 10rem 1.25rem 5rem; }
      .hero::before { right: -40vw; width: 90vw; height: 90vw; top: 6rem; }
      .stats { gap: 2.5rem; padding: 2.5rem 1.25rem 4rem; flex-direction: column; }
      .stat-group { flex-direction: column; gap: 2rem; }
      .controls { flex-direction: column; padding: 0 1.25rem 2.5rem; align-items: stretch; }
      .search-wrap { min-width: 100%; }
      .projects { padding: 0 1.25rem 6rem; }
      .grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .card { grid-column: span 1; padding: 2.4rem; }
      .section-header { flex-direction: column; gap: 0.8rem; align-items: flex-start; margin-top: 4rem; }
    }
  </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Mobile overlay -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo">Laksh Builds</a>
      <div class="nav-links" id="navLinks">
        <a href="#projects">Works</a>
        <a href="https://github.com/LnAigal" target="_blank">GitHub</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">◐</button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main id="main-content">

  <!-- Hero -->
  <section class="hero">
    <span class="hero-label">Digital Workshop</span>
    <h1>
      <span class="line">LAKSH</span>
      <span class="line line-outline">BUILDS</span>
    </h1>
    <p>Forging bold interfaces, experimental tools, and immersive web experiences with precision and intent.</p>
  </section>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat-group">
      <div class="stat"><strong id="projCount">0</strong><span>Projects</span></div>
      <div class="stat"><strong id="catCount">0</strong><span>Categories</span></div>
      <div class="stat"><strong>2024</strong><span>Since</span></div>
    </div>
    <div class="stat"><span>Selected Works</span></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <label for="search" class="sr-only">Search projects</label><input type="text" id="search" placeholder="Search projects..." autocomplete="off">
    </div>
  </div>

  <!-- Projects -->
  <section class="projects" id="projects">
    <div class="grid" id="grid"></div>
  </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>© <span id="year"></span> Lakshminarayana Aigal — Forged in Code</p>
  </footer>

  <!-- Back to top -->
  <button class="back-top" id="backTop">↑</button>

  <script>
    const sectionOrder = ['Featured', 'Educational Platforms', 'Utilities & Apps', 'Personal'];

    const projects = [
      { name: "Fireverse OS", desc: "A web-based operating system interface with apps, utilities, and a modern desktop experience. Also includes a browser extension for enhanced integration.", url: "https://fireverse-os.vercel.app/", github: "https://addons.mozilla.org/en-US/developers/addon/fireverse-os/", tags: ["Web App", "OS", "Browser Extension"], icon: "🔥", section: "Featured", featured: true },
      { name: "Consumer Shield", desc: "Award-winning browser extension that detects dark patterns, privacy risks, and deceptive website practices. Maps findings to India's DPDP Act 2023 and helps users make informed privacy decisions. Built during a national-level hackathon at SMVIT Bangalore.", url: null, github: null, tags: ["Cybersecurity", "AI", "Browser Extension"], icon: "🛡️", section: "Featured", featured: true },
      { name: "AgriVision", desc: "Hackathon-winning AI solution for agriculture that leverages computer vision and machine learning to solve real-world farming challenges. Secured 3rd Place at Matrix Fusion 4.0.", url: null, github: null, tags: ["AI", "Computer Vision", "Agriculture"], icon: "🌾", section: "Featured", featured: true },
      { name: "Laksh Learns", desc: "A curated directory of online courses from top educational providers.", url: "https://lnaigal.github.io/Laksh-Learns/", github: null, tags: ["Education", "Learning"], icon: "🌐", section: "Featured", featured: true },
      { name: "NMAMIT Notes Hub", desc: "Your all-in-one hub for NMAMIT notes and study resources.", url: "https://lnaigal.github.io/NMAMIT-Notes-Hub/", github: null, tags: ["Education", "Notes"], icon: "📚", section: "Educational Platforms" },
      { name: "Laksh Guides", desc: "Your go-to reference for coding, tech, and academic essentials.", url: "https://lnaigal.github.io/Laksh-Guides/", github: null, tags: ["Reference", "Coding"], icon: "📖", section: "Educational Platforms" },
      { name: "SendHere", desc: "A simple, secure file sharing service. Upload a file, get a 6-character access key, and share it — no sign-up required.", url: "https://send-here.vercel.app/", github: null, tags: ["Tool", "Utility", "File Sharing"], icon: "📤", section: "Utilities & Apps" },
      { name: "Laksh Portfolio", desc: "Lakshminarayana Aigal's Portfolio.", url: "https://lnaigal.github.io/Laksh-Portfolio", github: null, tags: ["Portfolio", "Personal"], icon: "👤", section: "Personal" }
    ];

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    let activeTag = 'All';

    function render(list) {
      grid.innerHTML = '';
      document.getElementById('projCount').textContent = projects.length;
      if (!list.length) {
        grid.innerHTML = '<div class="no-results"><h3>No projects found</h3></div>';
        return;
      }
      const grouped = {};
      sectionOrder.forEach(s => grouped[s] = []);
      list.forEach(p => {
        if (grouped[p.section]) grouped[p.section].push(p);
      });
      let globalIdx = 0;
      sectionOrder.forEach(section => {
        const items = grouped[section];
        if (!items.length) return;
        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = `<h2>${section}</h2><span class="section-count">${items.length.toString().padStart(2, '0')}</span>`;
        grid.appendChild(header);
        items.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = 'card' + (p.featured ? ' card-featured' : '');
          card.style.animationDelay = `${globalIdx * 0.05}s`;
          let html = `
            <div class="card-header">
              <div class="card-title-group">
                <span class="card-index">Project ${(globalIdx + 1).toString().padStart(2, '0')}</span>
                <div class="card-name">${p.name}</div>
              </div>
            </div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
            <div class="card-actions">`;
          if (p.url) {
            html += `<a href="${p.url}" target="_blank" rel="noopener noreferrer" class="btn-visit">View Project</a>`;
          }
          if (p.github) {
            html += `<a href="${p.github}" target="_blank" rel="noopener noreferrer" class="btn-github">Extension</a>`;
          }
          html += `</div>`;
          card.innerHTML = html;
          grid.appendChild(card);
          globalIdx++;
        });
      });
    }

    function filter() {
      const q = search.value.toLowerCase();
      const list = projects.filter(p =>
        (p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)) &&
        (activeTag === 'All' || p.tags.includes(activeTag))
      );
      render(list);
    }

    search.addEventListener('input', filter);

    /* Navbar */
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', scrollY > 40));

    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    const overlay = document.getElementById('nav-overlay');
    function closeMenu() {
      hamburger.classList.remove('active');
      navLinks.classList.remove('open');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }
    function openMenu() {
      hamburger.classList.add('active');
      navLinks.classList.add('open');
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    hamburger.addEventListener('click', () => navLinks.classList.contains('open') ? closeMenu() : openMenu());
    overlay.addEventListener('click', closeMenu);
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

    /* Subtle grid effect */
    function initGrid() {
      const body = document.body;
      const grid = document.createElement('div');
      grid.className = 'bg-grid';
      body.appendChild(grid);
      const noise = document.createElement('div');
      noise.className = 'bg-noise';
      body.appendChild(noise);
    }

    /* Theme */
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('lb-theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (saved === 'light' || (!saved && prefersLight)) { document.documentElement.setAttribute('data-theme', 'light'); toggle.textContent = '◑'; }
    toggle.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? '' : 'light');
      toggle.textContent = isLight ? '◐' : '◑';
      localStorage.setItem('lb-theme', isLight ? '' : 'light');
    });

    /* Back to top */
    const backTop = document.getElementById('backTop');
    window.addEventListener('scroll', () => backTop.classList.toggle('show', scrollY > 500));
    backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    /* Categories count */
    const cats = new Set(projects.map(p => p.section));
    document.getElementById('catCount').textContent = cats.size;

    document.getElementById('year').textContent = new Date().getFullYear();

    /* Init */
    initGrid();
    render(projects);
  </script>
</body>
</html>
